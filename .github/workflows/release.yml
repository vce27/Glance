name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.0.3)'
        required: true
        default: '0.0.3'
      notes:
        description: 'Release notes (optional; defaults to docs/releases/vX.Y.Z.md)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version & notes
        id: ver
        shell: pwsh
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $ver = '${{ inputs.version }}'.TrimStart('v')
          } else {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+') { throw "Version must be X.Y.Z, got $ver" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $notesPath = "docs/releases/v$ver.md"
          $inputNotes = $env:INPUT_NOTES
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($inputNotes)) {
            $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Set-Content -Path $notesPath -Value $inputNotes.Trim() -Encoding utf8
          } elseif (-not (Test-Path $notesPath)) {
            $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            @(
              '## 更新说明'
              ''
              "Glance v$ver"
            ) | Set-Content -Path $notesPath -Encoding utf8
          }
          Copy-Item $notesPath (Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md') -Force
          Write-Host "Using notes: $notesPath"
          Get-Content $notesPath

      - name: Publish WinUI (win-x64)
        run: |
          dotnet publish winui/Glance.App/Glance.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishTrimmed=false -p:Version=${{ steps.ver.outputs.version }} -o publish/win-x64

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack Velopack release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          $notes = Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md'
          vpk pack `
            --packId Glance `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir publish/win-x64 `
            --mainExe Glance.exe `
            --packTitle Glance `
            --packAuthors vce27 `
            --releaseNotes $notes `
            --outputDir artifacts/velopack `
            --runtime win-x64

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'Glance-windows-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'publish/win-x64/*' $out -Recurse -Force
          @'
          Glance Windows 便携版（WinUI）

          无需安装，解压后运行 Glance.exe。
          便携版不支持应用内自动更新；请使用 Release 中的 Setup 安装包以启用 Velopack 更新。
          需要 Windows 10 1809+ / Windows 11。
          '@ | Set-Content -Encoding utf8 (Join-Path $out 'README.txt')
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath 'artifacts/Glance-windows-x64-portable.zip' -Force

      - name: Collect release downloads
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item 'artifacts/velopack/Glance-win-Setup.exe' 'artifacts/release/' -Force
          Copy-Item 'artifacts/Glance-windows-x64-portable.zip' 'artifacts/release/' -Force
          Copy-Item "artifacts/velopack/Glance-$ver-full.nupkg" 'artifacts/release/' -Force
          Copy-Item 'artifacts/velopack/releases.win.json' 'artifacts/release/' -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md') 'artifacts/release/RELEASE_NOTES.md' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glance-windows-x64
          path: artifacts/release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release body
        shell: bash
        run: |
          NOTES="artifacts/RELEASE_NOTES.md"
          {
            echo "## 下载"
            echo ""
            echo "- **Glance-win-Setup.exe** — 安装版（推荐，支持应用内自动更新）"
            echo "- **Glance-windows-x64-portable.zip** — 便携版（解压即用，不支持自动更新）"
            echo ""
            if [ -f "$NOTES" ]; then
              cat "$NOTES"
              echo ""
            fi
            echo "> \`*.nupkg\` / \`releases.win.json\` 供安装版自动更新使用，一般不用手动下载。"
          } > release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Glance v${{ needs.build.outputs.version }}
          body_path: release-body.md
          files: |
            artifacts/Glance-win-Setup.exe
            artifacts/Glance-windows-x64-portable.zip
            artifacts/*.nupkg
            artifacts/releases.win.json
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: true
