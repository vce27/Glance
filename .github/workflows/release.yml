name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.0.1)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $ver = '${{ inputs.version }}'.TrimStart('v')
          } else {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+') { throw "Version must be X.Y.Z, got $ver" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish WinUI (win-x64)
        run: |
          dotnet publish winui/Glance.App/Glance.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishTrimmed=false -p:Version=${{ steps.ver.outputs.version }} -o publish/win-x64

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack Velopack release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          vpk pack `
            --packId Glance `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir publish/win-x64 `
            --mainExe Glance.exe `
            --packTitle Glance `
            --packAuthors vce27 `
            --outputDir artifacts/velopack `
            --runtime win-x64

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'Glance-windows-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'publish/win-x64/*' $out -Recurse -Force
          @'
          Glance Windows 便携版（WinUI）

          无需安装，解压后运行 Glance.exe。
          便携版不支持应用内自动更新；请使用 Release 中的 Setup 安装包以启用 Velopack 更新。
          需要 Windows 10 1809+ / Windows 11。
          '@ | Set-Content -Encoding utf8 (Join-Path $out 'README.txt')
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath 'artifacts/Glance-windows-x64-portable.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glance-windows-x64
          path: |
            artifacts/velopack/**
            artifacts/Glance-windows-x64-portable.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Glance v${{ needs.build.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
