name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.0.3)'
        required: true
        default: '0.0.3'
      notes:
        description: 'Release notes (optional; defaults to docs/releases/vX.Y.Z.md)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version & notes
        id: ver
        shell: pwsh
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $ver = '${{ inputs.version }}'.TrimStart('v')
          } else {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+') { throw "Version must be X.Y.Z, got $ver" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $notesPath = "docs/releases/v$ver.md"
          $inputNotes = $env:INPUT_NOTES
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($inputNotes)) {
            $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Set-Content -Path $notesPath -Value $inputNotes.Trim() -Encoding utf8
          } elseif (-not (Test-Path $notesPath)) {
            $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            @(
              '## 更新说明'
              ''
              "Glance v$ver"
            ) | Set-Content -Path $notesPath -Encoding utf8
          }
          Copy-Item $notesPath (Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md') -Force
          Write-Host "Using notes: $notesPath"
          Get-Content $notesPath

      - name: Publish WinUI (win-x64)
        run: |
          dotnet publish winui/Glance.App/Glance.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishTrimmed=false -p:Version=${{ steps.ver.outputs.version }} -o publish/win-x64

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack Velopack (inner setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          $notes = Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md'
          $icon = 'winui/Glance.App/Assets/AppIcon.ico'
          vpk pack `
            --packId Glance `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir publish/win-x64 `
            --mainExe Glance.exe `
            --packTitle Glance `
            --packAuthors vce27 `
            --icon $icon `
            --releaseNotes $notes `
            --outputDir artifacts/velopack `
            --runtime win-x64

          # Keep Velopack payload; outer Inno Setup will be the public installer.
          Move-Item 'artifacts/velopack/Glance-win-Setup.exe' 'artifacts/velopack/Glance-win-VelopackSetup.exe' -Force
          Get-ChildItem artifacts/velopack | Format-Table Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $iscc /? | Select-Object -First 3

      - name: Build Setup (Inno + choose directory)
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $inner = (Resolve-Path 'artifacts/velopack/Glance-win-VelopackSetup.exe').Path
          $icon = (Resolve-Path 'winui/Glance.App/Assets/AppIcon.ico').Path
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          & $env:ISCC `
            "/DMyAppVersion=$ver" `
            "/DVelopackSetup=$inner" `
            "/DMyAppIcon=$icon" `
            'packaging/installer/Glance.iss'
          if (-not (Test-Path 'artifacts/release/Glance-win-Setup.exe')) {
            throw 'Inno did not produce artifacts/release/Glance-win-Setup.exe'
          }
          Copy-Item "artifacts/velopack/Glance-$ver-full.nupkg" 'artifacts/release/' -Force
          Copy-Item 'artifacts/velopack/releases.win.json' 'artifacts/release/' -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'RELEASE_NOTES.md') 'artifacts/release/RELEASE_NOTES.md' -Force
          Get-ChildItem artifacts/release | Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glance-windows-x64
          path: artifacts/release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release body
        shell: bash
        run: |
          NOTES="artifacts/RELEASE_NOTES.md"
          {
            echo "## 下载"
            echo ""
            echo "- **Glance-win-Setup.exe** — 安装程序（可选安装目录，支持应用内自动更新）"
            echo ""
            if [ -f "$NOTES" ]; then
              cat "$NOTES"
              echo ""
            fi
            echo "> \`*.nupkg\` / \`releases.win.json\` 供安装版自动更新使用，一般不用手动下载。"
          } > release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Glance v${{ needs.build.outputs.version }}
          body_path: release-body.md
          files: |
            artifacts/Glance-win-Setup.exe
            artifacts/*.nupkg
            artifacts/releases.win.json
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: true
